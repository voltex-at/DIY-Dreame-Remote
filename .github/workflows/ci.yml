name: Firmware checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Portable core with address and undefined-behavior sanitizers
        run: python3 tools/test.py --sanitize
  es3c35p:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build exact ES3C35P hardware bring-up
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          set -o pipefail
          idf.py -B build-board set-target esp32s3 2>&1 | tee configure.log
          idf.py -B build-board build 2>&1 | tee build.log
          idf.py -B build-board size > size.txt
          idf.py -B build-board size-components > size-components.txt
          xtensa-esp32s3-elf-size -A build-board/diy_dreame_remote.elf > sections.txt
          idf.py -B build-board merge-bin -o "$GITHUB_WORKSPACE/build-board/DIY-Dreame-Remote-es3c35p-bringup.bin"
      - name: Package development image, reports and license notices
        shell: bash
        run: |
          mkdir -p build-board/package/licenses build-board/package/bootloader build-board/package/partition_table
          cp build-board/DIY-Dreame-Remote-es3c35p-bringup.bin build-board/diy_dreame_remote.bin build-board/flasher_args.json build-board/ota_data_initial.bin build-board/package/
          cp build-board/bootloader/bootloader.bin build-board/package/bootloader/
          cp build-board/partition_table/partition-table.bin build-board/package/partition_table/
          cp dependencies.lock sdkconfig configure.log build.log size.txt size-components.txt sections.txt build-board/package/
          cp LICENSE NOTICE.md third_party/* build-board/package/licenses/
          cp docs/INSTALL_AND_TEST_PL.md build-board/package/
          cp "$IDF_PATH/LICENSE" build-board/package/licenses/ESP-IDF-Apache-2.0.txt
          python3 tools/package_licenses.py --idf "$IDF_PATH" --managed managed_components --out build-board/package/licenses/vendor
          python3 tools/build_report.py --out build-board/package --source '${{ github.event.pull_request.head.sha || github.sha }}' --tested "$GITHUB_SHA"
      - name: Retain development package (not stable, no robot control)
        uses: actions/upload-artifact@v4
        with:
          name: lcdwiki-es3c35p-n16r8-bringup-NOT-STABLE
          path: build-board/package/
          if-no-files-found: error
      - name: Retain compiler and memory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es3c35p-diagnostics
          path: |
            configure.log
            build.log
            size.txt
            size-components.txt
            sections.txt
            build-board/diy_dreame_remote.elf
            build-board/diy_dreame_remote.map
            dependencies.lock
          if-no-files-found: warn
